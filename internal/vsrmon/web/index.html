<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>VSR Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>vsrmon</h1>
      <span class="muted">Viewstamped Replication cluster</span>
    </div>
    <div class="status">
      <span id="conn" class="conn" data-state="reconnecting"><i class="dot"></i><span id="conn-label">Reconnecting</span></span>
      <span id="updated" class="muted">Waiting for data</span>
    </div>
  </header>

  <main class="page">
    <section id="summary" class="summary" aria-label="Cluster summary"></section>

    <div class="layout">
      <section class="panel" aria-label="Topology">
        <div class="panel-head">
          <h2>Topology</h2>
          <ul class="legend">
            <li data-status="normal"><i class="swatch"></i>normal</li>
            <li data-status="view-change"><i class="swatch"></i>view change</li>
            <li data-status="recovering"><i class="swatch"></i>recovering</li>
            <li data-status="transitioning"><i class="swatch"></i>transitioning</li>
            <li data-status="shutdown"><i class="swatch"></i>shutdown</li>
            <li data-status="unreachable"><i class="swatch"></i>unreachable</li>
            <li data-edge="up"><i class="swatch line"></i>connected</li>
            <li data-edge="down"><i class="swatch line"></i>disconnected</li>
            <li data-edge="unknown"><i class="swatch line"></i>unknown</li>
          </ul>
        </div>
        <div class="graph-wrap">
          <svg id="graph" viewBox="0 0 560 560" role="img" aria-label="Replica topology"></svg>
          <p id="empty" class="empty">Waiting for data</p>
        </div>
      </section>

      <section class="panel" aria-label="Replicas">
        <div class="panel-head">
          <h2>Replicas</h2>
        </div>
        <div id="cards" class="cards"></div>
      </section>
    </div>
  </main>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
